<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f8"/>
      <stop offset="1" stop-color="#ececef"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#d9e8ff"/>
    </linearGradient>
  </defs>

  <rect width="860" height="620" fill="url(#bg)" rx="16"/>

  <!-- ===== Panel 1: composer with paperclip + pending card ===== -->
  <text x="30" y="36" font-size="15" font-weight="600" fill="#1a1a1a">① 输入框 · 回形针按钮 + 上传卡片</text>

  <!-- composer frame -->
  <rect x="30" y="50" width="780" height="150" rx="14" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- pending card above composer (240x64) -->
  <rect x="60" y="60" width="240" height="64" rx="16" fill="#ffffff" stroke="#c9c9d2"/>
  <!-- doc icon 28x28 blue -->
  <rect x="74" y="78" width="28" height="28" rx="6" fill="#418CFF"/>
  <rect x="80" y="88" width="16" height="2" rx="1" fill="#fff"/>
  <rect x="80" y="93" width="16" height="2" rx="1" fill="#fff"/>
  <rect x="80" y="98" width="12" height="2" rx="1" fill="#fff"/>
  <text x="114" y="90" font-size="13" font-weight="500" fill="#333">DSH入门+20插件筛选指南.pdf</text>
  <text x="114" y="108" font-size="11" fill="#999">275 KB</text>
  <!-- remove button -->
  <circle cx="300" cy="60" r="9" fill="rgba(0,0,0,.7)"/>
  <text x="296" y="64" font-size="11" fill="#fff">✕</text>
  <!-- paperclip button in composer -->
  <circle cx="56" cy="185" r="15" fill="#fff" stroke="#b0b0ba"/>
  <text x="47" y="191" font-size="16" fill="#666">📎</text>
  <text x="84" y="191" font-size="13" fill="#333">上传文档或图片（仅文本提取）</text>
  <!-- send button -->
  <rect x="720" y="172" width="70" height="34" rx="17" fill="#4d7fff"/>
  <text x="740" y="194" font-size="13" fill="#fff" font-weight="600">发送</text>

  <!-- ===== Panel 2: message with attachment card in transcript ===== -->
  <text x="30" y="240" font-size="15" font-weight="600" fill="#1a1a1a">② 对话流 · 附件显示为卡片（点击展开全文）</text>

  <!-- user bubble row (right aligned) -->
  <rect x="480" y="256" width="330" height="230" rx="14" fill="url(#bubble)"/>
  <!-- attachment card inside bubble -->
  <rect x="498" y="270" width="240" height="64" rx="16" fill="#ffffff" stroke="#c9c9d2"/>
  <rect x="512" y="288" width="28" height="28" rx="6" fill="#EE5138"/>
  <path d="M516 300 l4 -6 l2 3 l3 -5 l5 8 z" fill="#fff"/>
  <text x="552" y="300" font-size="13" font-weight="500" fill="#333">分章标准规范.pdf</text>
  <text x="552" y="318" font-size="11" fill="#999">128 KB · 查看内容</text>
  <!-- user text bubble -->
  <rect x="520" y="346" width="272" height="40" rx="12" fill="#ffffff" opacity=".7"/>
  <text x="540" y="370" font-size="13" fill="#444">请根据这份规范检查章节文件</text>
  <!-- assistant reply -->
  <rect x="60" y="256" width="360" height="160" rx="14" fill="#ffffff" stroke="#e0e0e6"/>
  <text x="80" y="284" font-size="13" font-weight="600" fill="#333">好的，已读取「分章标准规范.pdf」</text>
  <text x="80" y="310" font-size="12" fill="#555">✅ 章节文件必须是顶层 dict（禁止 list）</text>
  <text x="80" y="332" font-size="12" fill="#555">✅ toc 分 part/chapter/section 三级</text>
  <text x="80" y="354" font-size="12" fill="#555">✅ 标题清洗：剥页码、编号规范化</text>
  <text x="80" y="376" font-size="12" fill="#555">✅ 四层同步 + 验收清单</text>
  <text x="80" y="402" font-size="11" fill="#999">模型读取了完整文件内容</text>

  <!-- ===== Panel 3: file type icons ===== -->
  <text x="30" y="520" font-size="15" font-weight="600" fill="#1a1a1a">③ 官方彩色文档图标（从 chat.deepseek.com 前端提取）</text>
  <g transform="translate(60, 545)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#418CFF"/>
    <rect x="4" y="10" width="20" height="2" rx="1" fill="#fff"/>
    <rect x="4" y="15" width="20" height="2" rx="1" fill="#fff"/>
    <rect x="4" y="20" width="14" height="2" rx="1" fill="#fff"/>
    <text x="40" y="19" font-size="12" fill="#666">文本 / 代码</text>

    <rect x="160" y="0" width="28" height="28" rx="6" fill="#EE5138"/>
    <path d="M164 12 l4 -6 l2 3 l3 -5 l5 8 z" fill="#fff"/>
    <text x="200" y="19" font-size="12" fill="#666">PDF</text>

    <rect x="300" y="0" width="28" height="28" rx="6" fill="#3FB67F"/>
    <rect x="306" y="6" width="7" height="7" rx="1" fill="#fff"/>
    <rect x="315" y="6" width="7" height="7" rx="1" fill="#fff"/>
    <rect x="306" y="15" width="7" height="7" rx="1" fill="#fff"/>
    <rect x="315" y="15" width="7" height="7" rx="1" fill="#fff"/>
    <text x="340" y="19" font-size="12" fill="#666">表格</text>

    <rect x="440" y="0" width="28" height="28" rx="6" fill="#8B76F6"/>
    <path d="M446 16 l4 -6 l2 3 l3 -5 l5 8 z" fill="#fff"/>
    <text x="480" y="19" font-size="12" fill="#666">图片</text>

    <rect x="580" y="0" width="28" height="28" rx="6" fill="#FB8E34"/>
    <circle cx="594" cy="14" r="6" fill="#fff"/>
    <text x="620" y="19" font-size="12" fill="#666">PPT</text>
  </g>
</svg>
